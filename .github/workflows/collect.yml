name: collect

# GitHub 예약 실행은 자주 건너뛰어서, 한 번 시작하면 약 4시간 50분 동안 2분마다 집계하고
# 끝날 때 다음 실행을 스스로 시작합니다. 매시 정각 예약은 사슬이 끊겼을 때 다시 살리는 용도예요.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 작업 전체 시간 제한에 걸리면 아래 "Start next run"까지 건너뛰어 사슬이 끊깁니다.
      # 그래서 이 단계에 먼저 제한을 걸어, 넘쳐도 다음 실행은 꼭 시작되게 합니다.
      - name: Collect every 2 minutes
        timeout-minutes: 335
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 290*60 ))
          last_data=0; last_state=$(date +%s)
          while [ "$(date +%s)" -lt "$end" ]; do
            out=$(timeout 40m python collect.py 2>&1) || true
            echo "$(date -u +%H:%M) $out" | tail -n 1
            now=$(date +%s)
            # 숫자가 바뀌면 바로, 아니면 10분에 한 번만 올립니다(저장소가 커지지 않게).
            if echo "$out" | grep -q "changed=1" || [ $((now - last_data)) -ge 600 ]; then
              git add docs/data.json
              # 전체 의견 목록(state)은 30분에 한 번만 저장합니다.
              if [ $((now - last_state)) -ge 1800 ]; then git add state; last_state=$now; fi
              if ! git diff --cached --quiet; then
                git commit -q -m "update tally"
                git pull -q --rebase --autostash && git push -q || echo "push failed"
              fi
              last_data=$now
            fi
            sleep 120
          done
          git add docs/data.json state
          git diff --cached --quiet || { git commit -q -m "update tally"; git pull -q --rebase --autostash && git push -q; }

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml -R "${{ github.repository }}"
