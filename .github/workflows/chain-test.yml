name: chain-test
on:
  workflow_dispatch:
    inputs:
      step:
        default: "1"
permissions:
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "chain step ${{ inputs.step }}"
      - if: inputs.step == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run chain-test.yml -R "${{ github.repository }}" -f step=2
